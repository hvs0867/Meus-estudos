<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

    <form action="#" method="post" id="form-contato">
        <!--modificações: antes tava sem o label e o exercicio pedio para adicionar o label em todos os campos| adicionei o required| removi o required para facilitar os testes -->

        <label for="campo-nome2">Nome completo</label>
        <input type="text" name="nome" id="campo-nome2" placeholder="Seu nome"  minlength="5" required>
        <br>

        <label for="campo-email">Seu email</label>
        <input type="email" name="email" id="campo-email" placeholder="Seu email" >
        <br>

        <label for="campo-senha">Senha</label>
        <input type="password" name="senha" id="campo-senha" placeholder="Sua senha" >
        <br>

        <label for="campo-idade">Sua idade</label>
        <input type="number"id="campo-idade" name="idade" placeholder="Sua idade" >
        <br>

        <label for="campo-data-nasc">Sua Data de Nascimento</label>
        <input type="date" name="nascimento" id="campo-data-nasc">
        <br>

        <!--telefone + label + pattern-->
        <label for="numero">Telefone</label>
        <input type="text" id="numero" name="telefone" pattern="([0-9]{2}) [0-9]{5}-[0-9]{4}" title="Formato esperado: (00) 00000-0000">

        <hr>
        <label for="campo-termos">Aceite os Termos de Uso</label>
        <input type="checkbox" id="campo-termos" name="Termos" value="sim" >
        <br><br>

        <label for="campo-F">Feminino</label>
        <input type="radio" name="genero" value="F" id="campo-F" >
        <br>

        <label for="campo-M">Masculino</label>
        <input type="radio" name="genero" value="M" id="campo-M">
        <br>

        <label for="campo-Outro">Outro</label>
        <input type="radio" name="genero" value="outro" id="campo-Outro">
        <br>

        <input type="file" name="Foto-de-perfl">


        
        <hr>
        
        <select name="assunto">
            <option value="Duvida">Duvida</option>
            <option value="elogio">Elogio</option>
            <option value="reclamação">Reclamação</option>
        </select>
        <r><br>
            
            <textarea name="mensagem" rows="3" placeholder="Escreva a sua mensagem para os devs desse site!"></textarea>
            <br><br>
            
            <!--usando o pattern 03/09/26 14:50-->
            <label for="Cep">CEP</label>
            <input type="text" name="CEP" id="Cep" pattern="[0-9]{5}-[0-9]{3}" title="Formato esperado: 00000-000">
            
            <br><br>
            <button type="submit">Enviar</button>
        <hr>
        
        <h2>usando o label:</h2>

        <label for="campo-nome">Nome Completo</label>
        <input type="text" id="campo-nome" name="nome" placeholder="Seu Nome">
        <br>
        <label for="termos">Aceite os Termos de Uso</label>
        <input type="checkbox" id="termos" name="Aceite" value="Sim">

    </form>

</body>
</html>

<script>
    const formulario = document.querySelector("#form-contato");
    console.log(formulario)
    
    formulario.addEventListener("submit",
     function(event){
        event.preventDefault();
        alert("Mensagem enciada com sucesso");
     });
</script>
